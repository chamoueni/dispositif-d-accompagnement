name: Garder le projet Supabase actif

# Supabase (offre gratuite) met en pause tout projet sans activité depuis
# plus de 7 jours. Ce workflow envoie une petite requête de lecture toutes
# les 3 jours pour empêcher la mise en pause automatique.
on:
  schedule:
    - cron: "0 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier la configuration Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [[ -z "$SUPABASE_URL" || -z "$SUPABASE_ANON_KEY" ]]; then
            echo "::error::Ajoutez SUPABASE_URL et SUPABASE_ANON_KEY dans Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [[ ! "$SUPABASE_URL" =~ ^https://[^/]+/?$ ]]; then
            echo "::error::SUPABASE_URL doit être l'URL HTTPS racine du projet, sans chemin."
            exit 1
          fi

      - name: Requête de lecture sur la table "avis"
        run: |
          curl --fail --silent --show-error \
            --retry 2 --retry-all-errors --connect-timeout 10 --max-time 30 \
            "${SUPABASE_URL%/}/rest/v1/avis?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -o /dev/null
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
