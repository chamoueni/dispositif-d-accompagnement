<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Thème (clair/sombre/auto) de tout le site (voir composables/useTheme.js
         et components/ThemeSwitcher.vue) : pose data-theme sur <html> AVANT le
         premier rendu, sinon la page s'affiche brièvement avec le thème par
         défaut puis "saute" au bon thème une fois Vue et useTheme.js exécutés
         (flash blanc en mode sombre). Lit la même clé localStorage ("theme")
         que le composable, qui prend le relais ensuite (état réactif, écoute
         des changements système en mode "auto").
         Applique aussi .mode-confort si déjà actif (voir stores/accessibility.js,
         mécanisme existant du bouton "Aa" de la navbar, inchangé) : même
         raison, éviter un flash de texte petite taille au chargement. -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('theme') || 'auto'
          var sombre =
            theme === 'dark' ||
            (theme === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.setAttribute('data-theme', sombre ? 'dark' : 'light')
          if (localStorage.getItem('dispositif.modeConfort') === '1') {
            document.documentElement.classList.add('mode-confort')
          }
        } catch {
          // localStorage indisponible (navigation privée stricte, etc.) : le
          // thème clair par défaut s'applique simplement, rien de cassé.
        }
      })()
    </script>
    <!-- Logo fourni par l'utilisateur (src/assets/logo.png), copié dans public/
         pour servir de favicon avec un chemin stable. -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dispositif d'accompagnement personnalisé</title>
    <!-- Fraunces (titres, style éditorial) + Inter (texte) : inspiré de la maquette
         Mlezi pour une identité plus marquée que la police système par défaut.
         IBM Plex Mono a été retirée : la seule règle qui s'en servait vise <code>,
         balise qu'aucune page du site n'utilise — c'étaient deux fichiers de
         police téléchargés pour rien, ce qui compte sur une connexion lente.
         "display=swap" est conservé : le texte s'affiche tout de suite dans une
         police de repli au lieu de rester invisible pendant le chargement. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&family=Nunito+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
